name: Publish CurseForge

on:
  workflow_dispatch:
    inputs:
      loader:
        description: Loader to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge

permissions:
  contents: read

jobs:
  publish-forge:
    if: ${{ inputs.loader == 'all' || inputs.loader == 'forge' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out Forge branch
        uses: actions/checkout@v4
        with:
          ref: codex/forge-1.20.1

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build Forge 1.20.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify Forge artifact and changelog
        run: |
          expected="build/libs/fishing_rod_compat-0.9.0.jar"
          test -f "$expected"
          awk '/^##[[:space:]]+/ { heading=$2; gsub(/^\[/,"",heading); gsub(/\].*$/, "", heading); if (found && heading != "0.9.0") exit; if (heading == "0.9.0") found=1 } found { print }' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish Forge 1.20.1
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/fishing_rod_compat-0.9.0.jar
          version: 0.9.0
          name: fishing_rod_compat-0.9.0-forge-1.20.1
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

  publish-neoforge:
    if: ${{ inputs.loader == 'all' || inputs.loader == 'neoforge' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out NeoForge branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build NeoForge 1.21.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Verify NeoForge artifact and changelog
        run: |
          expected="build/libs/fishing_rod_compat-0.9.0.jar"
          test -f "$expected"
          awk '/^##[[:space:]]+/ { heading=$2; gsub(/^\[/,"",heading); gsub(/\].*$/, "", heading); if (found && heading != "0.9.0") exit; if (heading == "0.9.0") found=1 } found { print }' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish NeoForge 1.21.1
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/fishing_rod_compat-0.9.0.jar
          version: 0.9.0
          name: fishing_rod_compat-0.9.0-neoforge-1.21.1
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
