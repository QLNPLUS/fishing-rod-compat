name: Publish CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      loader:
        description: Loader to publish
        required: true
        default: all
        type: choice
        options:
          - all
          - forge
          - neoforge
      version:
        description: Mod version for a manual publish
        required: true
        default: 1.2.0
        type: string

permissions:
  contents: read

jobs:
  publish-forge:
    if: >-
      (github.event_name == 'release' && endsWith(github.event.release.tag_name, '-forge-1.20.1'))
      || (github.event_name == 'workflow_dispatch' && (inputs.loader == 'all' || inputs.loader == 'forge'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out Forge branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'codex/forge-1.20.1' }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build Forge 1.20.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            version="${version%-forge-1.20.1}"
          else
            version="$MANUAL_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid mod version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify Forge artifact and changelog
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          expected="build/libs/fishing_rod_compat-$VERSION.jar"
          test -f "$expected"
          awk '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != ENVIRON["VERSION"]) exit
              if (heading == ENVIRON["VERSION"]) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish Forge 1.20.1
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/fishing_rod_compat-${{ steps.release_version.outputs.version }}.jar
          version: ${{ steps.release_version.outputs.version }}
          name: fishing_rod_compat-${{ steps.release_version.outputs.version }}-forge-1.20.1
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: forge
          game-versions: 1.20.1
          java: 17

  publish-neoforge:
    if: >-
      (github.event_name == 'release' && endsWith(github.event.release.tag_name, '-neoforge-1.21.1'))
      || (github.event_name == 'workflow_dispatch' && (inputs.loader == 'all' || inputs.loader == 'neoforge'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out NeoForge branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CurseForge configuration
        env:
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$CURSEFORGE_TOKEN"

      - name: Build NeoForge 1.21.1
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Resolve release version
        id: release_version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
            version="${version%-neoforge-1.21.1}"
          else
            version="$MANUAL_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Invalid mod version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify NeoForge artifact and changelog
        env:
          VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          expected="build/libs/fishing_rod_compat-$VERSION.jar"
          test -f "$expected"
          awk '
            /^##[[:space:]]+/ {
              heading = $2
              gsub(/^\[/, "", heading)
              gsub(/\].*$/, "", heading)
              if (found && heading != ENVIRON["VERSION"]) exit
              if (heading == ENVIRON["VERSION"]) found = 1
            }
            found { print }
          ' CHANGELOG.md > build/curseforge-changelog.md
          test -s build/curseforge-changelog.md

      - name: Publish NeoForge 1.21.1
        uses: Kira-NT/mc-publish@v3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/fishing_rod_compat-${{ steps.release_version.outputs.version }}.jar
          version: ${{ steps.release_version.outputs.version }}
          name: fishing_rod_compat-${{ steps.release_version.outputs.version }}-neoforge-1.21.1
          version-type: release
          changelog-file: build/curseforge-changelog.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
